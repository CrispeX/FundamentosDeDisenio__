<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Althea | Solicitudes, reservas y abonos</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/logo.png" alt="Althea">
        <div class="brand-text"><strong>althea</strong><span>Solicitudes, reservas y abonos</span></div>
      </div>
      <nav id="menu" class="menu"></nav>
    </aside>
    <div class="area-principal">
      <header class="barra-superior" aria-label="Usuario actual">
      <div class="identidad-modulo"><strong>Gestión de viajes</strong><span>Solicitudes · Reservas · Abonos</span></div>
      <div class="usuario">
        <div class="avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="#a9c4e4"><circle cx="12" cy="9" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>
        </div>
        <div><div class="usuario-nombre">Laura Gómez</div><div class="usuario-rol">Asesor Comercial</div></div>
      </div>
      </header>
    <div class="navegacion-contexto"><nav id="miga" aria-label="Ruta de navegación"></nav><div><button id="nav-atras" class="btn btn-chico btn-borde" type="button">← Atrás</button><button id="nav-adelante" class="btn btn-chico btn-borde" type="button">Adelante →</button></div></div>
    <div id="conexion" class="estado-conexion" role="status" aria-live="polite" hidden></div>
    <main class="contenido" id="vista" tabindex="-1"></main>
    </div>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <dialog id="dialogo"></dialog>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/recomendaciones.js"></script>
  <script src="js/wizard.js"></script>
  <script src="js/reservas.js"></script>
  <script src="js/reserva-flujo.js"></script>
  <script src="js/gestion.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
